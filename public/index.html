<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trường Tiểu học Quỳnh Châu - Quản lý hồ sơ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Family -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Root App Shell -->
  <div id="app">
    <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-lg font-medium">Đang tải Hệ thống Quản lý Hồ sơ - Trường TH Quỳnh Châu...</p>
      </div>
    </div>
  </div>

  <!-- Inline Application Bundle -->
  <script>
    // Application State Store
    const state = {
      currentUser: null,
      usersList: [],
      categories: [],
      departments: [],
      documents: [],
      schoolYears: ['2026-2027'],
      teacherFolders: [],
      activeCategory: 'personal',
      activeSubDepartment: 'to1',
      activeTeacherFolderId: null,
      personalSubmenuOpen: true,
      searchQuery: '',
      selectedSchoolYear: '2026-2027',
      viewMode: 'compact', // 'compact' list or 'grid'
      driveConfig: {},
      activeModal: null,
      editingCategory: null,
      previewDoc: null,
      toast: null,
      loginError: '',
      resetUserPassTarget: null,
      uploadProgress: null
    };

    function showToast(msg, type = 'success') {
      state.toast = { msg, type };
      renderApp();
      setTimeout(() => {
        state.toast = null;
        renderApp();
      }, 4000);
    }

    function getRoleText(role) {
      switch (role) {
        case 'admin': return 'Quản trị viên (Admin)';
        case 'bgh': return 'Ban Giám Hiệu (BGH)';
        case 'totruong': return 'Tổ trưởng Chuyên môn';
        case 'giaovien': return 'Giáo viên';
        default: return role;
      }
    }

    function getRoleBadgeStyle(role) {
      switch (role) {
        case 'admin': return 'bg-purple-100 text-purple-700 border-purple-200';
        case 'bgh': return 'bg-rose-100 text-rose-700 border-rose-200';
        case 'totruong': return 'bg-amber-100 text-amber-800 border-amber-200';
        case 'giaovien': return 'bg-blue-100 text-blue-700 border-blue-200';
        default: return 'bg-slate-100 text-slate-700';
      }
    }

    function getUserInitials(name) {
      if (!name) return 'GV';
      const clean = name.trim().replace(/[^a-zA-Z0-9\s\u00C0-\u024F\u1EA0-\u1EF9]/g, '');
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 0) return 'GV';
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function renderAvatarHTML(user, sizeClass = 'w-9 h-9', textClass = 'text-xs') {
      if (user && user.avatar && user.avatar.trim()) {
        return `<img src="${user.avatar.trim()}" class="${sizeClass} rounded-full object-cover ring-2 ring-blue-500/20" />`;
      }
      const initials = user ? getUserInitials(user.fullName || user.username) : 'GV';
      return `<div class="${sizeClass} rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold flex items-center justify-center ${textClass} shadow-xs border border-white/20 flex-shrink-0">${initials}</div>`;
    }

    async function initData() {
      // Check saved login session in localStorage
      const savedUserJson = localStorage.getItem('school_user_session');
      if (savedUserJson) {
        try {
          state.currentUser = JSON.parse(savedUserJson);
        } catch (e) {
          localStorage.removeItem('school_user_session');
        }
      }

      if (!state.currentUser) {
        renderApp();
        return;
      }

      try {
        const [resCat, resDep, resDrive, resYears, resFolders] = await Promise.all([
          fetch('/api/categories').then(r => r.json()),
          fetch('/api/departments').then(r => r.json()),
          fetch('/api/drive/config').then(r => r.json()),
          fetch('/api/school-years').then(r => r.json()),
          fetch('/api/teacher-folders', { headers: { 'x-user-id': state.currentUser.id } }).then(r => r.json())
        ]);

        if (resCat.success) state.categories = resCat.categories;
        if (resDep.success) state.departments = resDep.departments;
        if (resDrive.success) state.driveConfig = resDrive.config;
        if (resYears.success) {
          state.schoolYears = resYears.schoolYears;
          if (!state.schoolYears.includes(state.selectedSchoolYear)) {
            state.selectedSchoolYear = state.schoolYears[0] || '2026-2027';
          }
        }
        if (resFolders.success) state.teacherFolders = resFolders.teacherFolders;
        
        await fetchUsersList();
        await fetchDocuments();
      } catch (err) {
        console.error("Init Error:", err);
      }
      renderApp();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const username = form.username.value.trim();
      const password = form.password.value;

      state.loginError = '';
      renderApp();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          state.currentUser = data.user;
          localStorage.setItem('school_user_session', JSON.stringify(data.user));
          await initData();
        } else {
          state.loginError = data.message || 'Tên đăng nhập hoặc mật khẩu không chính xác';
          renderApp();
        }
      } catch (err) {
        state.loginError = 'Lỗi kết nối máy chủ';
        renderApp();
      }
    }

    function handleLogout() {
      localStorage.removeItem('school_user_session');
      state.currentUser = null;
      state.documents = [];
      showToast("Đã đăng xuất khỏi hệ thống", "info");
      renderApp();
    }

    async function handleChangePasswordSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const oldPassword = form.oldPassword.value;
      const newPassword = form.newPassword.value;
      const confirmPassword = form.confirmPassword.value;

      if (newPassword !== confirmPassword) {
        showToast("Mật khẩu mới và xác nhận mật khẩu không khớp!", "error");
        return;
      }

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify({ oldPassword, newPassword })
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.activeModal = null;
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi khi đổi mật khẩu", "error");
      }
    }

    async function handleAdminResetPassSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const newPassword = form.newPassword.value;
      if (!state.resetUserPassTarget || !newPassword) return;

      try {
        const res = await fetch(`/api/users/${state.resetUserPassTarget.id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify({ password: newPassword })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Đã đặt lại mật khẩu cho giáo viên ${state.resetUserPassTarget.fullName} thành công!`);
          state.activeModal = 'user_list';
          state.resetUserPassTarget = null;
          await fetchUsersList();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi đổi mật khẩu giáo viên", "error");
      }
    }

    async function fetchUsersList() {
      if (!state.currentUser) return;
      try {
        const res = await fetch('/api/users', {
          headers: { 'x-user-id': state.currentUser.id }
        });
        const data = await res.json();
        if (data.success) state.usersList = data.users;
      } catch (err) {}
    }

    async function fetchTeacherFolders() {
      try {
        let url = `/api/teacher-folders`;
        if (state.activeCategory === 'personal' && state.activeSubDepartment) {
          url += `?departmentId=${state.activeSubDepartment}`;
        }
        const res = await fetch(url, { headers: { 'x-user-id': state.currentUser.id } });
        const data = await res.json();
        if (data.success) state.teacherFolders = data.teacherFolders;
      } catch (err) {}
    }

    async function fetchDocuments() {
      if (!state.currentUser) return;
      try {
        let url = `/api/documents?categoryId=${state.activeCategory}&schoolYear=${state.selectedSchoolYear}`;
        if (state.activeCategory === 'personal' && state.activeSubDepartment) {
          url += `&departmentId=${state.activeSubDepartment}`;
        }
        if (state.activeTeacherFolderId) {
          url += `&teacherFolderId=${state.activeTeacherFolderId}`;
        }
        if (state.searchQuery) {
          url += `&search=${encodeURIComponent(state.searchQuery)}`;
        }

        const res = await fetch(url, {
          headers: { 'x-user-id': state.currentUser.id }
        });
        const data = await res.json();
        if (data.success) {
          state.documents = data.documents;
        }
      } catch (err) {}
    }

    async function switchUser(userId) {
      const found = state.usersList.find(u => u.id === userId);
      if (found) {
        state.currentUser = found;
        localStorage.setItem('school_user_session', JSON.stringify(found));
        showToast(`Đã chuyển sang tài khoản: ${found.fullName} (${getRoleText(found.role)})`, 'info');
        await fetchTeacherFolders();
        await fetchDocuments();
        renderApp();
      }
    }

    async function deleteDocument(docId) {
      if (!confirm("Bạn có chắc chắn muốn xóa hồ sơ này khỏi hệ thống?")) return;
      try {
        const res = await fetch(`/api/documents/${docId}`, {
          method: 'DELETE',
          headers: { 'x-user-id': state.currentUser.id }
        });
        const data = await res.json();
        if (data.success) {
          showToast("Đã xóa hồ sơ thành công");
          await fetchDocuments();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi khi xóa", "error");
      }
    }

    async function deleteUser(userId) {
      if (!confirm("Bạn có chắc chắn muốn xóa tài khoản này khỏi hệ thống?")) return;
      try {
        const res = await fetch(`/api/users/${userId}`, {
          method: 'DELETE',
          headers: { 'x-user-id': state.currentUser.id }
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          await fetchUsersList();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi khi xóa tài khoản", "error");
      }
    }

    async function deleteTeacherFolder(folderId) {
      if (!confirm("Bạn có chắc chắn muốn xóa thư mục thành viên này?")) return;
      try {
        const res = await fetch(`/api/teacher-folders/${folderId}`, {
          method: 'DELETE',
          headers: { 'x-user-id': state.currentUser.id }
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          if (state.activeTeacherFolderId === folderId) {
            state.activeTeacherFolderId = null;
          }
          await fetchTeacherFolders();
          await fetchDocuments();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi khi xóa thư mục", "error");
      }
    }

    async function deleteSchoolYear(year) {
      if (!confirm(`Bạn có chắc chắn muốn xóa năm học ${year}?`)) return;
      try {
        const res = await fetch(`/api/school-years/${encodeURIComponent(year)}`, {
          method: 'DELETE',
          headers: { 'x-user-id': state.currentUser.id }
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.schoolYears = data.schoolYears;
          if (state.selectedSchoolYear === year) {
            state.selectedSchoolYear = state.schoolYears[0] || '2026-2027';
          }
          await fetchDocuments();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi khi xóa năm học", "error");
      }
    }

    async function handleUploadSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      formData.append('categoryId', state.activeCategory);
      formData.append('departmentId', state.activeCategory === 'personal' ? state.activeSubDepartment : (state.currentUser.departmentId || 'to1'));

      state.uploadProgress = 0;
      renderApp();

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/documents', true);
      xhr.setRequestHeader('x-user-id', state.currentUser.id);

      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          const percent = Math.round((event.loaded / event.total) * 100);
          state.uploadProgress = percent;
          const progBar = document.getElementById('uploadProgressFill');
          const progText = document.getElementById('uploadProgressText');
          if (progBar) progBar.style.width = percent + '%';
          if (progText) progText.innerText = `Đang tải tệp lên Google Drive: ${percent}%...`;
        }
      };

      xhr.onload = async function () {
        state.uploadProgress = null;
        try {
          const data = JSON.parse(xhr.responseText);
          if (data.success) {
            showToast("Tải hồ sơ lên Google Drive và lưu vào thư mục thành công!");
            state.activeModal = null;
            await fetchDocuments();
            renderApp();
          } else {
            showToast(data.message || "Gửi thất bại", "error");
            renderApp();
          }
        } catch (parseErr) {
          showToast("Lỗi xử lý phản hồi máy chủ", "error");
          renderApp();
        }
      };

      xhr.onerror = function () {
        state.uploadProgress = null;
        showToast("Lỗi kết nối máy chủ", "error");
        renderApp();
      };

      xhr.send(formData);
    }

    async function handleEditCategorySubmit(e) {
      e.preventDefault();
      if (!state.editingCategory) return;
      const form = e.target;
      const name = form.name.value;
      const description = form.description.value;

      try {
        const res = await fetch(`/api/categories/${state.editingCategory.id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify({ name, description })
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.activeModal = null;
          state.editingCategory = null;
          const resCat = await fetch('/api/categories').then(r => r.json());
          if (resCat.success) state.categories = resCat.categories;
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi cập nhật danh mục", "error");
      }
    }

    async function handleProfileSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const avatar = form.avatar.value;

      try {
        const res = await fetch('/api/auth/profile', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify({ avatar })
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.currentUser = data.user;
          localStorage.setItem('school_user_session', JSON.stringify(data.user));
          state.activeModal = null;
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi cập nhật ảnh đại diện", "error");
      }
    }

    async function handleBulkTeachersSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const namesText = form.namesText.value;
      const defaultDeptId = form.defaultDeptId.value;

      const lines = namesText.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) {
        showToast("Vui lòng nhập ít nhất 1 họ tên giáo viên!", "error");
        return;
      }

      const teachers = lines.map(fullName => ({
        fullName,
        departmentId: defaultDeptId
      }));

      try {
        const res = await fetch('/api/users/bulk', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify({ teachers })
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.activeModal = null;
          await fetchUsersList();
          const resFolders = await fetch('/api/teacher-folders', { headers: { 'x-user-id': state.currentUser.id } }).then(r => r.json());
          if (resFolders.success) state.teacherFolders = resFolders.teacherFolders;
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi tạo nhiều tài khoản", "error");
      }
    }

    async function handleUserSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const body = {
        username: form.username.value,
        password: form.password.value,
        fullName: form.fullName.value,
        role: form.role.value,
        departmentId: form.departmentId.value,
        email: form.email.value,
        driveFolderUrl: form.driveFolderUrl ? form.driveFolderUrl.value : ''
      };

      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.activeModal = null;
          await fetchUsersList();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi tạo tài khoản", "error");
      }
    }

    async function handleSchoolYearSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const year = form.schoolYearInput.value;

      try {
        const res = await fetch('/api/school-years', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify({ year })
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.schoolYears = data.schoolYears;
          state.selectedSchoolYear = year.trim();
          state.activeModal = null;
          await fetchDocuments();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi thêm năm học", "error");
      }
    }

    async function handleTeacherFolderSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const body = {
        name: form.name.value,
        teacherId: form.teacherId.value,
        departmentId: state.activeCategory === 'personal' ? state.activeSubDepartment : (state.currentUser.departmentId || 'to1'),
        driveFolderUrl: form.driveFolderUrl.value
      };

      try {
        const res = await fetch('/api/teacher-folders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.activeModal = null;
          await fetchTeacherFolders();
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi tạo thư mục", "error");
      }
    }

    async function handleCategorySubmit(e) {
      e.preventDefault();
      const form = e.target;
      const body = {
        name: form.name.value,
        description: form.description.value,
        icon: 'FolderPlus'
      };

      try {
        const res = await fetch('/api/categories', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.activeModal = null;
          await initData();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi tạo danh mục", "error");
      }
    }

    async function handleDriveSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const body = {
        folderId: form.folderId.value,
        serviceAccountEmail: form.serviceAccountEmail.value,
        syncMode: form.syncMode.value,
        gasDeploymentUrl: form.gasDeploymentUrl ? form.gasDeploymentUrl.value : ''
      };

      try {
        const res = await fetch('/api/drive/config', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': state.currentUser.id
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          showToast(data.message);
          state.driveConfig = data.config;
          state.activeModal = null;
          renderApp();
        } else {
          showToast(data.message, "error");
        }
      } catch (err) {
        showToast("Lỗi lưu cấu hình Google Drive", "error");
      }
    }

    // LOGIN PAGE (Clean & Standard without demo accounts)
    function renderLoginPage() {
      const root = document.getElementById('app');
      root.innerHTML = `
        <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
          <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl border border-slate-100">
            
            <div class="text-center mb-8">

      if (state.activeModal === 'preview' && state.previewDoc) {
        let embedUrl = state.previewDoc.driveEmbedUrl || state.previewDoc.driveViewUrl;
        const driveIdMatch = (state.previewDoc.driveViewUrl || '').match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (driveIdMatch && driveIdMatch[1]) {
          embedUrl = `https://drive.google.com/file/d/${driveIdMatch[1]}/preview`;
        } else if (state.previewDoc.localFileUrl) {
          const fullFileUrl = window.location.origin + state.previewDoc.localFileUrl;
          if (state.previewDoc.fileName.endsWith('.pdf')) {
            embedUrl = state.previewDoc.localFileUrl;
          } else {
            embedUrl = `https://docs.google.com/gview?url=${encodeURIComponent(fullFileUrl)}&embedded=true`;
          }
        }

        return `
          <div class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-5xl w-full h-[88vh] flex flex-col shadow-2xl overflow-hidden">
              <div class="p-4 bg-slate-900 text-white flex items-center justify-between flex-shrink-0">
                <div class="min-w-0 pr-4">
                  <h4 class="font-bold text-sm truncate">${state.previewDoc.title}</h4>
                  <p class="text-xs text-slate-400 truncate">${state.previewDoc.fileName} • Giáo viên gửi: ${state.previewDoc.teacherName}</p>
                </div>
                <div class="flex items-center gap-3 flex-shrink-0">
                  <a href="${state.previewDoc.driveViewUrl}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-xs">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Xem trên Google Drive
                  </a>
                  <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
              </div>
              <div class="flex-1 bg-slate-100 relative">
                <iframe src="${embedUrl}" class="w-full h-full border-0" allow="autoplay"></iframe>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    window.promptResetPass = function(userId, fullName) {
      state.resetUserPassTarget = { id: userId, fullName: fullName };
      state.activeModal = 'admin_reset_pass';
      renderApp();
    };

    window.promptEditCategory = function(catId) {
      const cat = state.categories.find(c => c.id === catId);
      if (cat) {
        state.editingCategory = cat;
        state.activeModal = 'edit_category';
        renderApp();
      }
    };

    window.setCategory = async function(catId) {
      state.activeCategory = catId;
      state.activeTeacherFolderId = null;
      await fetchTeacherFolders();
      await fetchDocuments();
      renderApp();
    };

    window.setSubDepartment = async function(deptId) {
      state.activeCategory = 'personal';
      state.activeSubDepartment = deptId;
      state.activeTeacherFolderId = null;
      await fetchTeacherFolders();
      await fetchDocuments();
      renderApp();
    };

    window.selectTeacherFolder = async function(folderId) {
      state.activeTeacherFolderId = folderId;
      await fetchDocuments();
      renderApp();
    };

    window.clearTeacherFolderFilter = async function() {
      state.activeTeacherFolderId = null;
      await fetchDocuments();
      renderApp();
    };

    window.setViewMode = function(mode) {
      state.viewMode = mode;
      renderApp();
    };

    window.togglePersonalSubmenu = function() {
      state.personalSubmenuOpen = !state.personalSubmenuOpen;
      renderApp();
    };

    window.onSearchChange = async function(e) {
      state.searchQuery = e.target.value;
      await fetchDocuments();
      renderApp();
    };

    window.onYearChange = async function(e) {
      state.selectedSchoolYear = e.target.value;
      await fetchDocuments();
      renderApp();
    };

    window.openModal = function(modalName) {
      state.activeModal = modalName;
      renderApp();
    };

    window.closeModal = function() {
      state.activeModal = null;
      state.previewDoc = null;
      state.resetUserPassTarget = null;
      renderApp();
    };

    window.copyGasScriptCode = function() {
      const code = `function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var folderId = data.folderId || '1HcXf2-Vfi5Vishz_SqP42bc1R8biScQA';
    var fileName = data.fileName || 'Tai_lieu.pdf';
    var fileBytes = Utilities.base64Decode(data.fileBase64);
    var blob = Utilities.newBlob(fileBytes, data.mimeType || 'application/octet-stream', fileName);
    
    var folder;
    try {
      folder = DriveApp.getFolderById(folderId);
    } catch (err) {
      folder = DriveApp.getRootFolder();
    }
    
    var file = folder.createFile(blob);
    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    
    return ContentService.createTextOutput(JSON.stringify({
      success: true,
      fileId: file.getId(),
      driveViewUrl: file.getUrl(),
      driveDownloadUrl: "https://drive.google.com/uc?export=download&id=" + file.getId()
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ success: false, error: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  return ContentService.createTextOutput(JSON.stringify({ success: true, message: "Apps Script API Online" })).setMimeType(ContentService.MimeType.JSON);
}`;

      navigator.clipboard.writeText(code).then(() => {
        showToast("Đã copy mã Google Apps Script vào bộ nhớ tạm!");
      }).catch(() => {
        showToast("Không thể copy tự động, vui lòng copy thủ công", "error");
      });
    };

    window.openPreview = function(docId) {
      const doc = state.documents.find(d => d.id === docId);
      if (doc) {
        state.previewDoc = doc;
        state.activeModal = 'preview';
        renderApp();
      }
    };

    document.addEventListener('DOMContentLoaded', initData);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initData();
    }
  </script>
</body>
</html>
